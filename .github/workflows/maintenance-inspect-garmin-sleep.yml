name: Maintenance Inspect Garmin Sleep Payload

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type INSPECT_SLEEP to dump the structure of stored Garmin sleep raw data"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: runsee-production-maintenance
  cancel-in-progress: false

jobs:
  inspect-garmin-sleep:
    name: Inspect Garmin sleep payload structure
    runs-on: ubuntu-latest
    environment: RUNSEE_VM_HOST
    env:
      SSH_HOST: ${{ vars.RUNSEE_VM_HOST || secrets.RUNSEE_VM_HOST }}
      SSH_USER: ${{ vars.RUNSEE_VM_USER || secrets.RUNSEE_VM_USER }}
      SSH_KEY: ${{ secrets.RUNSEE_VM_SSH_KEY }}
      SSH_PORT: ${{ vars.RUNSEE_VM_PORT || secrets.RUNSEE_VM_PORT || '22' }}
      REMOTE_PATH: /srv/runsee/repo
      COMPOSE_FILE: deployment/linux/docker-compose.prod.yml
      BACKEND_ENV: /srv/runsee/env/runsee-backend-prod.env
      FRONTEND_ENV: /srv/runsee/env/runsee-frontend-prod.env

    steps:
      - name: Validate confirmation
        run: |
          test "${{ inputs.confirm }}" = "INSPECT_SLEEP" || (echo "Invalid confirmation token" && exit 1)

      - name: Check deployment secrets
        run: |
          test -n "${SSH_HOST}" || (echo "RUNSEE_VM_HOST is missing" && exit 1)
          test -n "${SSH_USER}" || (echo "RUNSEE_VM_USER is missing" && exit 1)
          test -n "${SSH_KEY}" || (echo "RUNSEE_VM_SSH_KEY is missing" && exit 1)

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_KEY}" | tr -d '\r' > ~/.ssh/runsee_vm
          chmod 600 ~/.ssh/runsee_vm
          ssh-keyscan -p "${SSH_PORT}" "${SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Dump Garmin sleep payload structure
        run: |
          ssh -i ~/.ssh/runsee_vm -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
            "cd '${REMOTE_PATH}'; docker compose --env-file '${BACKEND_ENV}' --env-file '${FRONTEND_ENV}' -f '${COMPOSE_FILE}' exec -T backend node scripts/maintenance/inspect-garmin-sleep-payload.js"

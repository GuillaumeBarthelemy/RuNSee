name: Maintenance Renormalize Garmin Recovery

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RENORMALIZE_GARMIN to re-compute recovery snapshots from stored raw data (no Garmin API call)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: runsee-production-maintenance
  cancel-in-progress: false

jobs:
  renormalize-garmin:
    name: Re-normalize Garmin recovery snapshots
    runs-on: ubuntu-latest
    environment: RUNSEE_VM_HOST
    env:
      SSH_HOST: ${{ vars.RUNSEE_VM_HOST || secrets.RUNSEE_VM_HOST }}
      SSH_USER: ${{ vars.RUNSEE_VM_USER || secrets.RUNSEE_VM_USER }}
      SSH_KEY: ${{ secrets.RUNSEE_VM_SSH_KEY }}
      SSH_PORT: ${{ vars.RUNSEE_VM_PORT || secrets.RUNSEE_VM_PORT || '22' }}
      REMOTE_PATH: /srv/runsee/repo
      COMPOSE_FILE: deployment/linux/docker-compose.prod.yml
      BACKEND_ENV: /srv/runsee/env/runsee-backend-prod.env
      FRONTEND_ENV: /srv/runsee/env/runsee-frontend-prod.env

    steps:
      - name: Validate confirmation
        run: |
          test "${{ inputs.confirm }}" = "RENORMALIZE_GARMIN" || (echo "Invalid confirmation token" && exit 1)

      - name: Check deployment secrets
        run: |
          test -n "${SSH_HOST}" || (echo "RUNSEE_VM_HOST is missing" && exit 1)
          test -n "${SSH_USER}" || (echo "RUNSEE_VM_USER is missing" && exit 1)
          test -n "${SSH_KEY}" || (echo "RUNSEE_VM_SSH_KEY is missing" && exit 1)

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_KEY}" | tr -d '\r' > ~/.ssh/runsee_vm
          chmod 600 ~/.ssh/runsee_vm
          ssh-keyscan -p "${SSH_PORT}" "${SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Snapshot counts before renormalization
        run: |
          ssh -i ~/.ssh/runsee_vm -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
            "cd '${REMOTE_PATH}'; docker compose --env-file '${BACKEND_ENV}' --env-file '${FRONTEND_ENV}' -f '${COMPOSE_FILE}' exec -T postgres psql -v ON_ERROR_STOP=1 -U runsee_app -d runsee_prod" <<'SQL'
          SELECT 'before' AS step,
                 COUNT(*) AS total_snapshots,
                 COUNT(*) FILTER (WHERE "sleepScore" IS NULL OR "sleepScore" = 0) AS sleep_score_zero_or_null,
                 COUNT(*) FILTER (WHERE "restingHr" IS NULL OR "restingHr" = 0) AS resting_hr_zero_or_null,
                 COUNT(*) FILTER (WHERE "dataQuality" = 'complete') AS complete,
                 COUNT(*) FILTER (WHERE "dataQuality" = 'partial') AS partial,
                 COUNT(*) FILTER (WHERE "dataQuality" = 'absent') AS absent
          FROM "ExternalDailyRecoverySnapshot"
          WHERE "sourceProvider" = 'garminconnect_unofficial';
          SQL

      - name: Run renormalization script in backend container
        run: |
          ssh -i ~/.ssh/runsee_vm -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
            "cd '${REMOTE_PATH}'; docker compose --env-file '${BACKEND_ENV}' --env-file '${FRONTEND_ENV}' -f '${COMPOSE_FILE}' exec -T backend node scripts/maintenance/renormalize-garmin-recovery.js"

      - name: Snapshot counts after renormalization
        run: |
          ssh -i ~/.ssh/runsee_vm -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
            "cd '${REMOTE_PATH}'; docker compose --env-file '${BACKEND_ENV}' --env-file '${FRONTEND_ENV}' -f '${COMPOSE_FILE}' exec -T postgres psql -v ON_ERROR_STOP=1 -U runsee_app -d runsee_prod" <<'SQL'
          SELECT 'after' AS step,
                 COUNT(*) AS total_snapshots,
                 COUNT(*) FILTER (WHERE "sleepScore" IS NULL OR "sleepScore" = 0) AS sleep_score_zero_or_null,
                 COUNT(*) FILTER (WHERE "restingHr" IS NULL OR "restingHr" = 0) AS resting_hr_zero_or_null,
                 COUNT(*) FILTER (WHERE "dataQuality" = 'complete') AS complete,
                 COUNT(*) FILTER (WHERE "dataQuality" = 'partial') AS partial,
                 COUNT(*) FILTER (WHERE "dataQuality" = 'absent') AS absent
          FROM "ExternalDailyRecoverySnapshot"
          WHERE "sourceProvider" = 'garminconnect_unofficial';
          SQL

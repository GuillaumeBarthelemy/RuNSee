name: Deploy RunNSee VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runsee-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint -- --max-warnings 0

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Validate PostgreSQL Prisma schema
        working-directory: backend
        run: npm run prisma:pg:validate

  deploy:
    name: Deploy to Ubuntu VM
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    env:
      SSH_HOST: ${{ secrets.RUNSEE_VM_HOST }}
      SSH_USER: ${{ secrets.RUNSEE_VM_USER }}
      SSH_KEY: ${{ secrets.RUNSEE_VM_SSH_KEY }}
      SSH_PORT: ${{ secrets.RUNSEE_VM_PORT || '22' }}
      REMOTE_PATH: /srv/runsee/repo
    steps:
      - name: Check deployment secrets
        run: |
          test -n "${SSH_HOST}" || (echo "RUNSEE_VM_HOST is missing" && exit 1)
          test -n "${SSH_USER}" || (echo "RUNSEE_VM_USER is missing" && exit 1)
          test -n "${SSH_KEY}" || (echo "RUNSEE_VM_SSH_KEY is missing" && exit 1)

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_KEY}" | tr -d '\r' > ~/.ssh/runsee_vm
          chmod 600 ~/.ssh/runsee_vm
          ssh-keyscan -p "${SSH_PORT}" "${SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Deploy exact commit
        run: |
          ssh -i ~/.ssh/runsee_vm -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
            "set -Eeuo pipefail; \
             cd '${REMOTE_PATH}'; \
             if ! git diff --quiet || ! git diff --cached --quiet; then echo 'Remote repository has uncommitted changes. Deployment aborted.'; exit 1; fi; \
             git fetch --prune origin main; \
             git checkout --detach '${GITHUB_SHA}'; \
             chmod +x deployment/linux/scripts/deploy-vm.sh; \
             RUNSEE_APP_DIR='${REMOTE_PATH}' deployment/linux/scripts/deploy-vm.sh '${GITHUB_SHA}'"

      - name: Public health checks
        run: |
          curl -fsSI https://runsee.runnsee.net >/dev/null
          curl -fsS https://api.runnsee.net/health >/dev/null
          curl -fsS https://api.runnsee.net/db/health >/dev/null

name: runsee-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: runsee-postgres-prod
    restart: unless-stopped
    env_file:
      - /srv/runsee/env/runsee-backend-prod.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-runsee_prod}
      POSTGRES_USER: ${POSTGRES_USER:-runsee_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - runsee-postgres-prod-data:/var/lib/postgresql/data
    networks:
      - runsee-internal
    mem_limit: 900m

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile.prod
      args:
        DATABASE_URL: ${DATABASE_URL}
    container_name: runsee-backend
    restart: unless-stopped
    env_file:
      - /srv/runsee/env/runsee-backend-prod.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3003/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - runsee-internal
    mem_limit: 700m

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_APP_BASE_URL: ${VITE_APP_BASE_URL:-https://runsee.runnsee.net}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.runnsee.net}
        VITE_LOCAL_API_BASE_URL: ${VITE_LOCAL_API_BASE_URL:-http://backend:3003}
    container_name: runsee-frontend
    restart: unless-stopped
    env_file:
      - /srv/runsee/env/runsee-frontend-prod.env
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - runsee-internal
    mem_limit: 180m

  cloudflared:
    image: cloudflare/cloudflared:2025.4.2
    container_name: runsee-cloudflared
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - /srv/runsee/cloudflared:/etc/cloudflared:ro
    networks:
      - runsee-internal
    mem_limit: 180m

networks:
  runsee-internal:
    driver: bridge

volumes:
  runsee-postgres-prod-data:
    driver: local

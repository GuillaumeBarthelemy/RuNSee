services:
  postgres:
    image: postgres:16-alpine
    container_name: runsee-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: runsee_dev
      POSTGRES_USER: runsee_app
      POSTGRES_PASSWORD: runsee_dev_password
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runsee_app -d runsee_dev"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - runsee-postgres-dev-data:/var/lib/postgresql/data

volumes:
  runsee-postgres-dev-data:
